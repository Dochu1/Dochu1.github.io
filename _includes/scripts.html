<script>
  /* The greedy menu measures itself once, often before web fonts and styles have loaded,
     and only restores one hidden link per resize. Re-run it until it settles on load and resize. */
  (function () {
    function settle() { if (typeof updateNav === 'function') for (var i = 0; i < 10; i++) updateNav(); }
    window.addEventListener('load', settle);
    window.addEventListener('resize', settle);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
  })();
</script>

<script>
  /* Colour mode switch in the top bar: cycles Auto (system) -> Light -> Dark. */
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn || !window.siteTheme) return;
    var NEXT = { auto: 'light', light: 'dark', dark: 'auto' };
    var NAME = { auto: 'Auto (follows your system)', light: 'Light', dark: 'Dark' };
    function label() {
      var p = siteTheme.pref(), text = 'Colour mode: ' + NAME[p] + '. Click for ' + NAME[NEXT[p]].replace(/ \(.*\)/, '') + '.';
      btn.setAttribute('aria-label', text);
      btn.title = text;
    }
    btn.addEventListener('click', function () { siteTheme.set(NEXT[siteTheme.pref()]); label(); });
    window.addEventListener('themechange', label);
    label();
  })();
</script>
