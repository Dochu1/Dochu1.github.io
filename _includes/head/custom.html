{% include base_path %}

<!-- start custom head snippets -->

<meta name="theme-color" content="{% if site.color_scheme == "imperial" %}#003E74{% else %}#182B49{% endif %}">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base_path }}/assets/css/leok-style.css">
{% if site.color_scheme == "imperial" %}<link rel="stylesheet" href="{{ base_path }}/assets/css/theme-imperial.css">{% endif %}
{% if page.demo %}<link rel="stylesheet" href="{{ base_path }}/assets/css/demos.css">{% endif %}

<!-- end custom head snippets -->
